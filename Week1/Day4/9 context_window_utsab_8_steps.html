<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the Context Window Works in LLMs — Simple Guide</title>
<style>
/* =========================================================
   1. DESIGN TOKENS
   ========================================================= */
:root{
  --navy:#0f1f3d; --navy2:#1b2f57; --navy3:#2a4373;
  --orange:#f97316; --orange-d:#c2410c; --orange-soft:#fff1e6;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-soft:#e8f0fe;
  --green:#16a34a; --green-d:#15803d; --green-soft:#e6f6ec;
  --red:#dc2626; --red-soft:#fdecec;
  --amber:#d97706; --amber-soft:#fef6e4;
  --ink:#1e293b; --ink2:#334155; --muted:#64748b; --line:#e2e8f0; --line2:#cbd5e1;
  --bg:#f3f6fb; --card:#ffffff; --soft:#f8fafc;
  /* context component colours */
  --c-sys:#1e3a5f; --c-dev:#6366f1; --c-hist:#2563eb; --c-asst:#60a5fa;
  --c-rag:#16a34a; --c-user:#f97316; --c-out:#94a3b8; --c-tool:#0891b2;
  --c-new:#e11d48; --c-sum:#0d9488;
  --radius:14px; --radius-s:9px;
  --shadow:0 1px 2px rgba(15,31,61,.06),0 6px 22px rgba(15,31,61,.07);
  --mono:ui-monospace,"SFMono-Regular","Cascadia Code",Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
input,select,textarea{font-family:inherit;font-size:14px}
code,kbd{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:3px solid rgba(249,115,22,.55);outline-offset:2px}

/* =========================================================
   2. TOP BAR, PROGRESS, SECTION NAV
   ========================================================= */
.topbar{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 70%,#24427a 100%);color:#fff;padding:14px 22px 0;position:sticky;top:0;z-index:20}
.topbar-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--orange),#fb923c);display:grid;place-items:center;font-weight:800;letter-spacing:-.5px;font-size:15px;box-shadow:0 4px 14px rgba(249,115,22,.45);flex:none}
.brand h1{font-size:18px;margin:0;line-height:1.2;font-weight:700}
.brand p{margin:2px 0 0;font-size:12.5px;color:#b8c7e6}
.step-meta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.step-counter{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-weight:600;white-space:nowrap}
.step-counter b{color:#fdba74}
.progress{height:6px;background:rgba(255,255,255,.12);border-radius:99px;margin:12px 0 0;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#fdba74);border-radius:99px;transition:width .45s ease}
.secnav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:thin}
.secnav::-webkit-scrollbar{height:5px}.secnav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:9px}
.chip{flex:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#dbe5f7;border-radius:999px;padding:6px 12px 6px 6px;font-size:12.5px;display:flex;align-items:center;gap:7px;transition:all .2s}
.chip .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-weight:700;font-size:11.5px}
.chip:hover{background:rgba(255,255,255,.14)}
.chip.done .n{background:var(--green);color:#fff}
.chip.active{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.chip.active .n{background:var(--orange);color:#fff}

/* =========================================================
   3. MAIN STAGE (visual + explanation)
   ========================================================= */
.stage{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:18px;padding:18px 22px 110px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.viz-card{display:flex;flex-direction:column;min-height:520px}
.viz-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.viz-head .sec-tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-d)}
.viz-head h2{margin:2px 0 0;font-size:21px;line-height:1.25;color:var(--navy)}
.viz-head .mini{margin-left:auto;font-size:12px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.dots span{width:18px;height:5px;border-radius:9px;background:var(--line)}
.dots span.on{background:var(--orange)}
.dots span.past{background:#fdba74}
.viz{padding:20px;flex:1;position:relative;min-width:0}
.explain{padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 200px);position:sticky;top:150px}
.explain-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);font-size:14px}
.explain-head .pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:pulse 1.8s infinite}
.explain-body{padding:16px 18px 20px;overflow-y:auto}
.explain-body p{margin:0 0 10px}
.lead{font-size:15.5px;color:var(--ink);font-weight:500}
.exb{border-radius:var(--radius-s);padding:10px 12px 10px 12px;margin:10px 0;border-left:4px solid;background:var(--soft);font-size:14px}
.exb h4{margin:0 0 4px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase}
.exb p,.exb ul{margin:0}.exb ul{padding-left:18px}.exb li{margin:3px 0}
.exb.what{border-color:var(--blue);background:var(--blue-soft)}.exb.what h4{color:var(--blue-d)}
.exb.why{border-color:var(--orange);background:var(--orange-soft)}.exb.why h4{color:var(--orange-d)}
.exb.how{border-color:var(--green);background:var(--green-soft)}.exb.how h4{color:var(--green-d)}
.exb.analogy{border-color:#8b5cf6;background:#f3effe}.exb.analogy h4{color:#6d28d9}
.exb.note{border-color:var(--amber);background:var(--amber-soft)}.exb.note h4{color:var(--amber)}
.exb.try{border-color:var(--navy);background:#eef2f9}.exb.try h4{color:var(--navy)}
.term{display:block;background:#fff;border:1px dashed var(--line2);border-radius:8px;padding:7px 10px;margin:6px 0;font-size:13.5px}
.term b{color:var(--navy)}

/* =========================================================
   4. CONTROLS
   ========================================================= */
.controls{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:10px;padding:9px 15px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:all .15s;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--navy3);background:var(--soft)}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--orange-d);border-color:var(--orange-d);color:#fff}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-navy:hover:not(:disabled){background:var(--navy3);color:#fff}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-green:hover:not(:disabled){background:var(--green-d);color:#fff}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn .ico{font-size:12px}
.ctrl-sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.kbd-hint{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
kbd{background:#fff;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px}
.speed{border:1px solid var(--line2);border-radius:8px;padding:7px;background:#fff}
.playing-badge{font-size:12px;color:var(--green-d);font-weight:700;display:none;align-items:center;gap:6px}
.playing-badge.on{display:inline-flex}
.playing-badge i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}

/* =========================================================
   5. GENERIC VISUAL PIECES
   ========================================================= */
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;background:#fff}
.box.soft{background:var(--soft)}
.box h5{margin:0 0 6px;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
.label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px}
.hyp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid #f5d79c;border-radius:999px;padding:3px 10px;margin-bottom:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--soft);border:1px solid var(--line)}
.pill.ok{background:var(--green-soft);color:var(--green-d);border-color:#bfe5cc}
.pill.bad{background:var(--red-soft);color:var(--red);border-color:#f5c2c2}
.pill.warn{background:var(--amber-soft);color:var(--amber);border-color:#f5d79c}
.pill.blue{background:var(--blue-soft);color:var(--blue-d);border-color:#c7d7fb}
.big-num{font-size:28px;font-weight:800;color:var(--navy);line-height:1.1}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.mt{margin-top:14px}.mt-s{margin-top:8px}.mb{margin-bottom:14px}
.sentence{font-size:22px;font-weight:600;color:var(--navy);background:var(--soft);border:2px dashed var(--line2);border-radius:12px;padding:14px 18px;text-align:center;font-family:var(--mono)}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:110px;flex:1}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.stat .v{font-size:20px;font-weight:800;color:var(--navy)}
.stat.ok{background:var(--green-soft);border-color:#bfe5cc}.stat.ok .v{color:var(--green-d)}
.stat.bad{background:var(--red-soft);border-color:#f5c2c2}.stat.bad .v{color:var(--red)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--soft);color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}

/* =========================================================
   6. TOKENS
   ========================================================= */
.toks{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.tok{display:inline-flex;flex-direction:column;align-items:center;border-radius:8px;padding:6px 9px;font-family:var(--mono);font-size:15px;font-weight:600;border:2px solid;white-space:pre;min-width:30px;animation:pop .45s both;animation-delay:var(--d,0s)}
.tok .id{font-size:11px;font-weight:600;margin-top:4px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.75);color:var(--navy)}
.tok .sp{color:var(--orange-d);opacity:.9}
.tk0{background:#dbeafe;border-color:#93c5fd;color:#1e3a8a}
.tk1{background:#ffedd5;border-color:#fdba74;color:#9a3412}
.tk2{background:#dcfce7;border-color:#86efac;color:#14532d}
.tk3{background:#ede9fe;border-color:#c4b5fd;color:#4c1d95}
.tk4{background:#fce7f3;border-color:#f9a8d4;color:#831843}
.tk5{background:#cffafe;border-color:#67e8f9;color:#155e75}
.tok.special{background:var(--navy);border-color:var(--navy);color:#fdba74}
.tok.byte{border-style:dashed}
.tok-count{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700}
.tok-count b{color:#fdba74;font-size:20px}
.ids{font-family:var(--mono);background:var(--navy);color:#e2e8f0;border-radius:10px;padding:10px 14px;font-size:14px;overflow-x:auto;white-space:nowrap}
.ids .n{color:#fdba74}
.ex-row{display:grid;grid-template-columns:200px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;animation:fadeUp .4s both;animation-delay:var(--d,0s)}
.ex-row .src{font-family:var(--mono);font-weight:600;color:var(--navy);white-space:pre}
.playground textarea{width:100%;min-height:74px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;resize:vertical;font-family:var(--mono);font-size:14px}

/* =========================================================
   7. FLOW DIAGRAMS & ANIMATED ARROWS
   ========================================================= */
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.node{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;transition:all .3s;position:relative;animation:fadeUp .45s both}
.node .nt{font-weight:700;color:var(--navy);font-size:14.5px;display:flex;align-items:center;gap:8px}
.node .nd{font-size:13px;color:var(--ink2);margin-top:3px}
.node .num{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--navy);flex:none}
.node.done{border-color:#bcd0f5;background:#f7faff}
.node.done .num{background:var(--blue);color:#fff}
.node.active{border-color:var(--orange);background:var(--orange-soft);box-shadow:0 0 0 4px rgba(249,115,22,.16),0 8px 20px rgba(249,115,22,.15);transform:scale(1.01)}
.node.active .num{background:var(--orange);color:#fff}
.node.ghost{opacity:.35;border-style:dashed;animation:none}
.node.ext{border-color:#86efac}
.arrow-v{height:30px;width:4px;margin:0 auto;position:relative;background:var(--line);border-radius:4px;overflow:hidden}
.arrow-v::after{content:"";position:absolute;left:0;top:-40%;width:100%;height:40%;background:linear-gradient(180deg,transparent,var(--orange));animation:flowV 1.1s linear infinite}
.arrow-v.idle::after{display:none}
.arrow-v-wrap{position:relative;height:34px}
.arrow-v-wrap .arrow-v{position:absolute;left:50%;transform:translateX(-50%);top:0;height:26px}
.arrow-v-wrap::after{content:"";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);border:7px solid transparent;border-top:8px solid var(--line2)}
.arrow-v-wrap.live::after{border-top-color:var(--orange)}
.arrow-h{flex:none;width:44px;height:4px;align-self:center;background:var(--line);border-radius:4px;position:relative;overflow:visible}
.arrow-h::before{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);border:6px solid transparent;border-left:8px solid var(--line2)}
.arrow-h.live{background:linear-gradient(90deg,var(--line),var(--orange));background-size:200% 100%;animation:flowH 1s linear infinite}
.arrow-h.live::before{border-left-color:var(--orange)}
.hflow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.hflow .node{flex:1;min-width:120px}

/* =========================================================
   8. CONTEXT WINDOW GRID & BARS
   ========================================================= */
.cw-frame{border:3px solid var(--navy);border-radius:14px;padding:10px;background:#fff;position:relative}
.cw-frame .cap{position:absolute;top:-12px;left:14px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 9px}
.cw-grid{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.cell{aspect-ratio:1/1;border-radius:3px;background:#f1f5f9;border:1px dashed #d5dde8;transition:transform .15s,box-shadow .15s}
.cell.f{border:none;background:var(--cc);animation:pop .3s both;animation-delay:var(--d,0s)}
.cell.f.out{background:repeating-linear-gradient(45deg,#cbd5e1 0 4px,#e2e8f0 4px 8px)}
.cell.dim{opacity:.18}
.cell.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--orange);transform:scale(1.08);z-index:2;position:relative}
.cell.click{cursor:pointer}
.cell.click:hover{transform:scale(1.15)}
.overflow-zone{margin-top:12px;border:3px dashed var(--red);border-radius:12px;padding:10px;background:var(--red-soft);animation:shake .5s both}
.overflow-zone .cap{color:var(--red);font-weight:800;font-size:12.5px;margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px 5px 7px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:all .15s}
.lg i{width:14px;height:14px;border-radius:4px;background:var(--cc);flex:none}
.lg i.out{background:repeating-linear-gradient(45deg,#cbd5e1 0 3px,#e2e8f0 3px 6px)}
button.lg:hover{border-color:var(--navy3)}
.lg.sel{border-color:var(--orange);background:var(--orange-soft);box-shadow:0 0 0 3px rgba(249,115,22,.18)}
.sbar{display:flex;height:34px;border-radius:9px;overflow:hidden;background:#eef2f7;border:1px solid var(--line);position:relative}
.sbar .seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;transition:width .5s ease;background:var(--cc);min-width:0}
.sbar .seg.out{background:repeating-linear-gradient(45deg,#94a3b8 0 6px,#a8b4c6 6px 12px);color:#fff}
.sbar .seg.over{background:repeating-linear-gradient(45deg,var(--red) 0 6px,#ef4444 6px 12px)}
.sbar-wrap{position:relative;padding-top:18px}
.cap-line{position:absolute;top:0;bottom:-4px;width:3px;background:var(--navy);border-radius:2px;z-index:3}
.cap-line span{position:absolute;top:-2px;left:6px;font-size:11px;font-weight:700;color:var(--navy);white-space:nowrap}
.meter{height:12px;border-radius:9px;background:#eef2f7;overflow:hidden;border:1px solid var(--line)}
.meter>div{height:100%;background:var(--green);border-radius:9px;transition:width .4s ease,background .3s}
.meter.bad>div{background:var(--red)}
.meter.warn>div{background:var(--amber)}
.detail{border:2px solid var(--line);border-radius:12px;padding:14px;background:#fff;animation:fadeUp .35s both}
.detail .dh{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);font-size:16px}
.detail .dh i{width:18px;height:18px;border-radius:5px;background:var(--cc)}

/* =========================================================
   9. PROMPT ASSEMBLY
   ========================================================= */
.assembly{display:grid;grid-template-columns:1fr 60px 1.1fr;gap:6px;align-items:start}
.src-list{display:flex;flex-direction:column;gap:7px}
.src{border:2px solid var(--line);border-left:7px solid var(--cc);border-radius:10px;padding:8px 11px;background:#fff;font-size:13px;animation:fadeUp .4s both;transition:all .3s}
.src b{color:var(--navy);display:block;font-size:13.5px}
.src.active{border-color:var(--orange);border-left-color:var(--cc);background:var(--orange-soft);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
.src.pending{opacity:.3;border-style:dashed;animation:none}
.req{border:3px solid var(--navy);border-radius:14px;padding:10px;background:#fbfcfe;min-height:200px;position:relative}
.req .cap{position:absolute;top:-12px;left:12px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 9px}
.req-item{border-radius:8px;padding:7px 10px;margin:6px 0;color:#fff;font-size:12.5px;font-weight:600;background:var(--cc);display:flex;justify-content:space-between;gap:8px;animation:slideIn .5s both}
.req-item.out{background:repeating-linear-gradient(45deg,#94a3b8 0 6px,#a8b4c6 6px 12px)}
.req-item.hl{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--orange)}
.mid-arrows{display:flex;align-items:center;justify-content:center;height:100%;min-height:200px}
.llm-box{margin-top:10px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;padding:12px 14px;text-align:center;font-weight:700}
.llm-box small{display:block;font-weight:400;color:#c7d4ee;font-size:12px}

/* =========================================================
   10. CHAT
   ========================================================= */
.chat{display:flex;flex-direction:column;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:220px}
.bub{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;animation:fadeUp .4s both;position:relative}
.bub.u{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub .who{display:block;font-size:10.5px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
.bub.hl{box-shadow:0 0 0 3px rgba(37,99,235,.45)}
.bub.ghost{opacity:.35}
mark{background:#fde68a;border-radius:3px;padding:0 2px;color:inherit}

/* =========================================================
   11. CODE BLOCKS
   ========================================================= */
.code{background:#0f1a30;border-radius:12px;overflow:hidden;border:1px solid #1e2c4b;margin-top:12px}
.code-head{display:flex;justify-content:space-between;align-items:center;background:#16233f;color:#9fb2d6;font-size:12px;padding:7px 12px;font-weight:600}
.code-head .lang{background:#22345a;border-radius:5px;padding:1px 7px;color:#fdba74;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;color:#e2e8f0;font-family:var(--mono);font-size:13px;line-height:1.6}
.t-kw{color:#c792ea}.t-str{color:#c3e88d}.t-num{color:#f78c6c}.t-com{color:#7f8fb0;font-style:italic}.t-fn{color:#82aaff}.t-key{color:#ffcb6b}.t-lit{color:#ff9cac}

/* =========================================================
   12. STRATEGIES (Section 6)
   ========================================================= */
.msgs{display:flex;flex-direction:column;gap:5px}
.msg{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:#fff;font-size:13px;transition:all .35s}
.msg .r{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 0;text-align:center;color:#fff}
.msg .r.U{background:var(--orange)}.msg .r.A{background:var(--blue)}
.msg .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.msg .tk{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted)}
.msg.drop{opacity:.35;text-decoration:line-through;background:var(--red-soft);border-color:#f5c2c2}
.msg.sum{background:#e6f7f5;border-color:#99ddd4;opacity:.55}
.msg.ret{background:var(--green-soft);border-color:#86efac;box-shadow:0 0 0 2px rgba(22,163,74,.2)}
.msg.cmp{background:#eef2ff;border-color:#c7d2fe;opacity:.55}
.msg.act{box-shadow:0 0 0 3px rgba(249,115,22,.45);transform:translateX(4px)}
.msg.fact .tx::after{content:"key fact";margin-left:6px;font-size:10px;font-weight:700;color:#9a3412;background:#ffedd5;border-radius:4px;padding:1px 5px;text-decoration:none;display:inline-block}
.msg.cur{border:2px dashed var(--orange);background:var(--orange-soft)}
.phase{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.phase span{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.phase span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.phase span.past{background:var(--blue-soft);color:var(--blue-d);border-color:#c7d7fb}
.summary-box{border:2px solid var(--c-sum);background:#ecfdf9;border-radius:10px;padding:10px 12px;font-size:13.5px;animation:pop .5s both}
.summary-box b{color:var(--c-sum)}
.state-box{border:2px solid #6366f1;background:#f5f5ff;border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;animation:pop .5s both}
.pl{list-style:none;padding:0;margin:0}
.pl li{padding:3px 0 3px 22px;position:relative;font-size:13.5px}
.pl.good li::before{content:"✓";position:absolute;left:2px;color:var(--green);font-weight:800}
.pl.bad li::before{content:"✕";position:absolute;left:2px;color:var(--red);font-weight:800}

/* =========================================================
   13. RAG
   ========================================================= */
.rag{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;position:relative}
.rag .lane-title{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.ext-zone{border:2px dashed #86efac;border-radius:14px;padding:12px;background:#f6fdf8}
.chunk{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:13px;display:grid;grid-template-columns:38px 1fr 90px;gap:10px;align-items:center;transition:all .35s;animation:fadeUp .4s both;animation-delay:var(--d,0s)}
.chunk .cid{font-weight:800;color:var(--navy);font-family:var(--mono)}
.chunk .score{font-family:var(--mono);font-size:12.5px;text-align:right}
.chunk .sbar2{height:6px;border-radius:9px;background:#eef2f7;margin-top:4px;overflow:hidden}
.chunk .sbar2>div{height:100%;background:var(--blue);border-radius:9px;transition:width .6s}
.chunk.top{border:2px solid var(--green);background:var(--green-soft)}
.chunk.top .sbar2>div{background:var(--green)}
.chunk.low{opacity:.55}
.vec{font-family:var(--mono);font-size:12.5px;background:#0f1a30;color:#c3e88d;border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.qbtn{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;text-align:left}
.qbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.inp{border:1px solid var(--line2);border-radius:9px;padding:8px 11px;width:100%}

/* =========================================================
   14. SWIMLANES (Section 9)
   ========================================================= */
.lanes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:relative}
.lane-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:7px 4px;border-radius:8px;color:#fff;background:var(--lc)}
.lane-cell{min-height:34px;border-left:1px dashed var(--line);border-right:1px dashed var(--line);display:flex;align-items:center;justify-content:center;padding:2px 0}
.lane-card{width:100%;border:2px solid var(--line);border-radius:9px;background:#fff;font-size:12px;padding:5px 7px;display:flex;gap:6px;align-items:center;transition:all .3s;animation:fadeUp .35s both}
.lane-card .num{width:19px;height:19px;border-radius:50%;background:var(--lc);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:800;flex:none}
.lane-card.active{border-color:var(--orange);background:var(--orange-soft);box-shadow:0 0 0 3px rgba(249,115,22,.2);font-weight:700}
.lane-card.pending{opacity:.25;border-style:dashed;animation:none}
.lane-card .lane-tag{display:none}

/* =========================================================
   15. SIMULATOR
   ========================================================= */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.field{margin-bottom:11px}
.field label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px;gap:8px}
.field label i{width:11px;height:11px;border-radius:3px;background:var(--cc);display:inline-block;margin-right:6px}
.field .pair{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:center}
.field input[type=number]{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;width:100%;font-family:var(--mono)}
.field input[type=range]{width:100%;accent-color:var(--orange)}
.verdict{border-radius:12px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;font-size:15px}
.verdict.ok{background:var(--green-soft);color:var(--green-d);border:2px solid #86efac}
.verdict.bad{background:var(--red-soft);color:var(--red);border:2px solid #fca5a5;animation:shake .4s}
.verdict .big{font-size:24px}

/* =========================================================
   16. QUIZ
   ========================================================= */
.quiz-q{font-size:17px;font-weight:700;color:var(--navy);margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:11px;padding:11px 14px;margin:7px 0;font-size:14.5px;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green-d);font-weight:700}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt:disabled{opacity:1;cursor:default}
.feedback{border-radius:10px;padding:11px 13px;margin-top:10px;font-size:14px;animation:fadeUp .3s both}
.feedback.ok{background:var(--green-soft);border:1px solid #86efac}
.feedback.bad{background:var(--red-soft);border:1px solid #fca5a5}
.qprog{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.qprog span{flex:1;min-width:14px;height:7px;border-radius:9px;background:var(--line)}
.qprog span.ok{background:var(--green)}.qprog span.bad{background:var(--red)}.qprog span.cur{background:var(--orange)}
.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:10px auto;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0)}
.score-ring>div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--navy)}

/* =========================================================
   17. ROADMAP (intro) & attention mini-diagram
   ========================================================= */
.roadmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.rm{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-align:left;transition:all .2s;animation:fadeUp .4s both;animation-delay:var(--d,0s)}
.rm:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:var(--shadow)}
.rm .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;font-weight:800;font-size:12.5px;margin-bottom:6px}
.rm b{display:block;color:var(--navy);font-size:14px}
.rm span{font-size:12.5px;color:var(--muted)}
.hero{background:linear-gradient(120deg,var(--navy),var(--navy3));color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero h3{margin:0 0 6px;font-size:20px}
.hero p{margin:0;color:#cdd8ee;font-size:14px}
.hero .tk-float{position:absolute;right:16px;top:14px;display:flex;gap:5px;opacity:.9}
svg text{font-family:var(--sans)}

/* =========================================================
   18. ANIMATIONS
   ========================================================= */
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes flowV{to{top:110%}}
@keyframes flowH{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}70%{box-shadow:0 0 0 9px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes dash{to{stroke-dashoffset:-20}}
.flow-dash{stroke-dasharray:6 4;animation:dash .8s linear infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}}

/* =========================================================
   19. RESPONSIVE
   ========================================================= */
@media (max-width:1080px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .explain{position:static;max-height:none}
  .topbar{position:static}
}
@media (max-width:760px){
  body{font-size:14.5px}
  .topbar{padding:12px 14px 0}
  .brand p{display:none}
  .step-meta{margin-left:0;width:100%;justify-content:space-between}
  .stage{padding:12px 10px 150px;gap:12px}
  .viz{padding:14px}
  .viz-head{padding:12px 14px}
  .viz-head h2{font-size:18px}
  .viz-head .mini{margin-left:0}
  .grid2,.grid3,.sim,.rag{grid-template-columns:minmax(0,1fr)}
  .assembly{grid-template-columns:minmax(0,1fr)}
  .mid-arrows{min-height:40px;transform:rotate(90deg)}
  .cw-grid{grid-template-columns:repeat(10,1fr)}
  .ex-row{grid-template-columns:1fr}
  .controls{padding:8px;gap:6px}
  .btn{padding:8px 11px;font-size:13px}
  .kbd-hint,.ctrl-sep{display:none}
  .sentence{font-size:17px}
  .lanes{grid-template-columns:1fr}
  .lane-h{display:none}
  .lane-cell{border:none;min-height:0}
  .lane-cell:empty{display:none}
  .lane-card .lane-tag{display:inline-block;margin-left:auto;font-size:10px;font-weight:700;color:#fff;background:var(--lc);border-radius:5px;padding:1px 6px}
  .msg{grid-template-columns:30px 1fr 54px}
  .hero .tk-float{display:none}
  .chunk{grid-template-columns:32px 1fr 70px}
}
/* ---- token slots (simple version) ---- */
.slots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.slot{border:1px dashed #d5dde8;border-radius:7px;min-height:42px;padding:3px 5px;font-family:var(--mono);font-size:12px;background:#f8fafc;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;white-space:pre}
.slot .p{font-size:9.5px;color:var(--muted);font-family:var(--sans)}
.slot.f{border:none;background:var(--cc);color:#fff;font-weight:600;animation:pop .3s both}
.slot.f .p{color:rgba(255,255,255,.8)}
.slot.hl{box-shadow:0 0 0 3px #fde68a;}
.slot.reading{outline:2px solid var(--orange);outline-offset:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
@media (max-width:760px){.slots{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>
</head>
<body>
<!-- =========================================================
     HEADER: brand, step counter, progress bar, section navigation
     ========================================================= -->
<header class="topbar">
  <div class="topbar-row">
    <div class="logo" aria-hidden="true">CW</div>
    <div class="brand">
      <h1>How the Context Window Works</h1>
      <p>One simple chat with Utsab — 8 steps</p>
    </div>
    <div class="step-meta">
      <span class="playing-badge" id="playingBadge"><i></i>Auto-playing</span>
      <span class="step-counter" id="stepCounter" aria-live="polite">Step <b>1</b> / 1</span>
    </div>
  </div>
  <div class="progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" id="progressBar"><div id="progressFill"></div></div>
  <nav class="secnav" id="secnav" aria-label="Sections"></nav>
</header>

<!-- =========================================================
     MAIN STAGE: visualisation (left) + explanation panel (right)
     ========================================================= -->
<main class="stage">
  <section class="card viz-card" aria-labelledby="stepTitle">
    <div class="viz-head">
      <div>
        <div class="sec-tag" id="secTag">Section</div>
        <h2 id="stepTitle">Loading…</h2>
        <div class="dots" id="secDots" aria-hidden="true"></div>
      </div>
      <span class="mini" id="secMini">Step 1 of 1</span>
    </div>
    <div class="viz" id="viz"></div>
  </section>
  <aside class="card explain" aria-label="Explanation">
    <div class="explain-head"><span class="pulse"></span>Explanation</div>
    <div class="explain-body" id="explainBody" aria-live="polite"></div>
  </aside>
</main>

<!-- =========================================================
     CONTROLS
     ========================================================= -->
<footer class="controls" aria-label="Lesson controls">
  <button class="btn" id="btnRestart" title="Restart from the first step"><span class="ico">⟲</span>Restart</button>
  <button class="btn" id="btnPrev" title="Previous step (Left arrow)"><span class="ico">◀</span>Previous</button>
  <button class="btn btn-primary" id="btnNext" title="Next step (Right arrow)">Next<span class="ico">▶</span></button>
  <span class="ctrl-sep"></span>
  <button class="btn btn-green" id="btnPlay" title="Auto-advance through steps"><span class="ico">►</span>Auto Play</button>
  <button class="btn" id="btnPause" title="Pause auto play" disabled><span class="ico">❚❚</span>Pause</button>
  <select class="speed" id="speed" aria-label="Auto play speed">
    <option value="5000">Fast (5s)</option>
    <option value="8000" selected>Normal (8s)</option>
    <option value="12000">Slow (12s)</option>
  </select>
  <span class="ctrl-sep"></span>
  <span class="kbd-hint"><kbd>←</kbd><kbd>→</kbd> to navigate</span>
</footer>
<script>
'use strict';
/* =====================================================================
   CORE: utilities, step engine, navigation, shared visual renderers.
   Every step has a deterministic render() function, so moving backward
   always rebuilds the exact visual state of that step from scratch.
   ===================================================================== */

/* ---------- 1. Small utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n).toLocaleString('en-US');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* Colour + label for each kind of context component */
const COMP = {
  sys:     { label: 'System instructions',      color: 'var(--c-sys)' },
  dev:     { label: 'Developer instructions',   color: 'var(--c-dev)' },
  hist:    { label: 'Conversation history',     color: 'var(--c-hist)' },
  asst:    { label: 'Previous assistant replies', color: 'var(--c-asst)' },
  rag:     { label: 'Retrieved documents (RAG)', color: 'var(--c-rag)' },
  user:    { label: 'Current user message',     color: 'var(--c-user)' },
  out:     { label: 'Output budget (reserved)', color: 'var(--c-out)' },
  tool:    { label: 'Tool calls & results',     color: 'var(--c-tool)' },
  newmsg:  { label: 'New user message',         color: 'var(--c-new)' },
  summary: { label: 'Summary of old history',   color: 'var(--c-sum)' }
};

/* ---------- 2. Timer registry (cleared on every step change) ---------- */
const App = { i: 0, timers: [], playTimer: null, speed: 8000, sim: null, quiz: null, rag: null };
function later(fn, ms) { const id = setTimeout(fn, ms); App.timers.push(id); return id; }
function every(fn, ms) { const id = setInterval(fn, ms); App.timers.push(id); return id; }
function clearStepTimers() { App.timers.forEach(id => { clearTimeout(id); clearInterval(id); }); App.timers = []; }

/* ---------- 3. Tiny syntax highlighter (python / js / json) ---------- */
function highlight(code, lang) {
  if (lang === 'text') return esc(code);
  const re = lang === 'json'
    ? /("(?:[^"\\\n]|\\.)*")(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?\b)/g
    : /(#[^\n]*|\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`[^`]*`)|\b(def|return|for|in|if|elif|else|import|from|while|and|or|not|None|True|False|class|with|as|const|let|function|new|of|raise|try|except)\b|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    if (lang === 'json') {
      if (m[1]) out += `<span class="${m[2] ? 't-key' : 't-str'}">${esc(m[1])}</span>${m[2] ? esc(m[2]) : ''}`;
      else if (m[3]) out += `<span class="t-lit">${m[3]}</span>`;
      else out += `<span class="t-num">${m[4]}</span>`;
    } else {
      if (m[1]) out += `<span class="t-com">${esc(m[1])}</span>`;
      else if (m[2]) out += `<span class="t-str">${esc(m[2])}</span>`;
      else if (m[3]) out += `<span class="t-kw">${m[3]}</span>`;
      else if (m[4]) out += `<span class="t-num">${m[4]}</span>`;
      else out += `<span class="t-fn">${esc(m[5])}</span>`;
    }
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
function codeBlock(code, lang = 'python', title = 'Example') {
  return `<div class="code"><div class="code-head"><span>${esc(title)}</span><span class="lang">${lang}</span></div><pre><code>${highlight(code.trim(), lang)}</code></pre></div>`;
}

/* ---------- 4. Explanation panel builder ---------- */
function ex(o) {
  let h = '';
  if (o.lead) h += `<p class="lead">${o.lead}</p>`;
  const blk = (cls, title, body) => body ? `<div class="exb ${cls}"><h4>${title}</h4>${Array.isArray(body) ? '<ul>' + body.map(b => `<li>${b}</li>`).join('') + '</ul>' : `<p>${body}</p>`}</div>` : '';
  h += blk('what', 'What happens', o.what);
  h += blk('why', 'Why it matters', o.why);
  h += blk('how', 'How it works', o.how);
  if (o.terms) h += `<div class="exb what" style="background:#fff"><h4>New terms</h4>${o.terms.map(t => `<span class="term"><b>${t[0]}</b> — ${t[1]}</span>`).join('')}</div>`;
  h += blk('analogy', 'Analogy', o.analogy);
  h += blk('try', 'Try it', o.try);
  h += blk('note', 'Accuracy note', o.note);
  if (o.extra) h += o.extra;
  return h;
}
const HYP = (t = 'Hypothetical numbers — for learning only') => `<div class="hyp">⚠ ${t}</div>`;

/* ---------- 5. Sections & step registry ---------- */
const SECTIONS = [
  { id: 'box',    n: 1, short: 'The Box',        title: 'What Is a Context Window?' },
  { id: 'inside', n: 2, short: 'What Goes In',   title: 'What Goes Into the Box' },

  { id: 'try',    n: 4, short: 'Try It',         title: 'Try It Yourself' }
];
const STEPS = [];
/** Register a teaching step. explain: string|function, render: (vizEl) => void */
function step(sec, title, explain, render) { STEPS.push({ sec, title, explain, render }); }

/* ---------- 6. Navigation engine ---------- */
function secInfo(i) {
  const sec = STEPS[i].sec;
  const idx = STEPS.map((s, k) => s.sec === sec ? k : -1).filter(k => k >= 0);
  return { sec, idx, pos: idx.indexOf(i), first: idx[0] };
}
function go(i, opts = {}) {
  i = clamp(i | 0, 0, STEPS.length - 1);
  App.i = i;
  clearStepTimers();
  const s = STEPS[i], info = secInfo(i), sec = SECTIONS.find(x => x.id === s.sec);
  // Visual
  const viz = $('#viz');
  viz.innerHTML = '';
  try { s.render(viz); } catch (e) { viz.innerHTML = `<p style="color:var(--red)">Render error: ${esc(e.message)}</p>`; console.error(e); }
  // Explanation
  $('#explainBody').innerHTML = typeof s.explain === 'function' ? s.explain() : s.explain;
  $('#explainBody').scrollTop = 0;
  // Headings
  $('#secTag').textContent = sec.n === 0 ? 'Getting started' : `Section ${sec.n} · ${sec.title}`;
  $('#stepTitle').textContent = s.title;
  $('#secMini').textContent = `Step ${info.pos + 1} of ${info.idx.length} in this section`;
  $('#secDots').innerHTML = info.idx.map((k, n) => `<span class="${n === info.pos ? 'on' : n < info.pos ? 'past' : ''}"></span>`).join('');
  // Counter + progress
  $('#stepCounter').innerHTML = `Step <b>${i + 1}</b> / ${STEPS.length}`;
  const pct = STEPS.length > 1 ? (i / (STEPS.length - 1)) * 100 : 100;
  $('#progressFill').style.width = pct + '%';
  $('#progressBar').setAttribute('aria-valuenow', Math.round(pct));
  // Section chips
  const curSecIndex = SECTIONS.findIndex(x => x.id === s.sec);
  $$('.chip').forEach((c, k) => {
    c.classList.toggle('active', k === curSecIndex);
    c.classList.toggle('done', k < curSecIndex);
    if (k === curSecIndex && opts.scrollChip !== false) c.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  });
  // Buttons
  $('#btnPrev').disabled = i === 0;
  $('#btnNext').disabled = i === STEPS.length - 1;
  // URL hash (deep link) — wrapped because some contexts (file://, sandboxes) may refuse it
  try { history.replaceState(null, '', '#step-' + (i + 1)); } catch (e) { /* ignore */ }
  // Keep the visual in view on small screens
  if (opts.scroll) { const card = $('.viz-card'); const r = card.getBoundingClientRect(); if (r.top < 0 || r.top > window.innerHeight * 0.6) card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
const next = () => { if (App.i < STEPS.length - 1) go(App.i + 1, { scroll: true }); };
const prev = () => { if (App.i > 0) go(App.i - 1, { scroll: true }); };

function play() {
  if (App.i >= STEPS.length - 1) go(0);
  stopPlayTimer();
  App.playTimer = setInterval(() => {
    if (App.i >= STEPS.length - 1) { pause(); return; }
    go(App.i + 1);
  }, App.speed);
  $('#btnPlay').disabled = true; $('#btnPause').disabled = false; $('#playingBadge').classList.add('on');
}
function stopPlayTimer() { if (App.playTimer) { clearInterval(App.playTimer); App.playTimer = null; } }
function pause() { stopPlayTimer(); $('#btnPlay').disabled = false; $('#btnPause').disabled = true; $('#playingBadge').classList.remove('on'); }
function restartPlayTimerIfPlaying() { if (App.playTimer) play(); }
function restart() { pause(); go(0, { scroll: true }); }

function buildNav() {
  $('#secnav').innerHTML = SECTIONS.map(s => `<button class="chip" data-sec="${s.id}" title="${esc(s.title)}"><span class="n">${s.n}</span>${esc(s.short)}</button>`).join('');
  $$('.chip').forEach(c => c.addEventListener('click', () => {
    const k = STEPS.findIndex(s => s.sec === c.dataset.sec);
    if (k >= 0) { go(k, { scroll: true }); restartPlayTimerIfPlaying(); }
  }));
  $('#btnNext').addEventListener('click', () => { next(); restartPlayTimerIfPlaying(); });
  $('#btnPrev').addEventListener('click', () => { prev(); restartPlayTimerIfPlaying(); });
  $('#btnPlay').addEventListener('click', play);
  $('#btnPause').addEventListener('click', pause);
  $('#btnRestart').addEventListener('click', restart);
  $('#speed').addEventListener('change', e => { App.speed = +e.target.value; restartPlayTimerIfPlaying(); });
  document.addEventListener('keydown', e => {
    const t = e.target, tag = (t.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); next(); restartPlayTimerIfPlaying(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); restartPlayTimerIfPlaying(); }
  });
}

/* ---------- Token chips ---------- */
function showSpaces(s) { return esc(s).replace(/ /g, '<span class="sp">·</span>').replace(/\n/g, '<span class="sp">↵</span>'); }
/** tokens: [{t:'text', id?:number, cls?:string}] */
function tokChips(tokens, { ids = false, stagger = 0.08 } = {}) {
  return `<div class="toks">${tokens.map((k, n) => `<span class="tok ${k.cls || 'tk' + (n % 6)}" style="--d:${(n * stagger).toFixed(2)}s">${showSpaces(k.t)}${ids && k.id != null ? `<span class="id">${k.id}</span>` : ''}</span>`).join('')}</div>`;
}

/* ---------- Toy tokenizer (illustration only, NOT a real model tokenizer) ---------- */
const TOY = {
  common: new Set(('the a an i you he she it we they is are was be to of and in on for with that this my your love like hello world cat dog model token text data learn python what name how why good great new time day ai artificial intelligence language large context window can do not all one two me am was were has have will would could should about from by at as or but if so no yes there their our here when where who which help please thank thanks small big fast slow read write code app user message chat'
    ).split(' ')),
  prefixes: ['inter', 'trans', 'under', 'over', 'anti', 'pre', 'dis', 'non', 'un', 're'],
  suffixes: ['ization', 'ation', 'tion', 'ness', 'ment', 'able', 'ible', 'ably', 'ing', 'ous', 'ive', 'ful', 'less', 'est', 'ly', 'ed', 'er', 'al', 's']
};
/** Stable illustrative ID: FNV-1a hash of the piece, mapped into a 50,000-entry "vocabulary" */
function toyId(piece) { let h = 2166136261; for (const ch of piece) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return 100 + (h % 49900); }
function toySplitWord(w) {
  // w may begin with a single leading space which stays attached to the first piece
  const lead = w.startsWith(' ') ? ' ' : '';
  const core = lead ? w.slice(1) : w;
  const low = core.toLowerCase();
  if (TOY.common.has(low) || core.length <= 4) return [w];
  const pieces = [];
  let start = 0, end = core.length;
  for (const p of TOY.prefixes) if (low.startsWith(p) && low.length - p.length >= 4) { pieces.push(core.slice(0, p.length)); start = p.length; break; }
  let suffix = '';
  for (const s of TOY.suffixes) if (low.endsWith(s) && end - start - s.length >= 3) { suffix = core.slice(end - s.length); end -= s.length; break; }
  let mid = core.slice(start, end);
  while (mid.length > 6) { pieces.push(mid.slice(0, 5)); mid = mid.slice(5); }
  if (mid) pieces.push(mid);
  if (suffix) pieces.push(suffix);
  pieces[0] = lead + pieces[0];
  return pieces;
}
function toyTokenize(text) {
  const out = [];
  const re = / ?[A-Za-z]+| ?\d{1,3}|\n|[ \t]+|[^\sA-Za-z\d]/gu;
  let m;
  while ((m = re.exec(text))) {
    const p = m[0];
    if (/^ ?[A-Za-z]+$/.test(p)) toySplitWord(p).forEach(t => out.push({ t, id: toyId(t) }));
    else if (p.codePointAt(0) > 127 && p !== ' ') {
      // Non-ASCII characters: real byte-level tokenizers often need several tokens. Toy rule: 1 token per 2 UTF-8 bytes.
      const bytes = new TextEncoder().encode(p).length, n = Math.max(1, Math.ceil(bytes / 2));
      for (let k = 0; k < n; k++) out.push({ t: k === 0 ? p : '‹byte›', id: toyId(p + k), cls: n > 1 ? 'tk' + (out.length % 6) + ' byte' : undefined });
    } else out.push({ t: p, id: toyId(p) });
  }
  return out;
}

/* ---------- Generic vertical/horizontal flow diagram ----------
   nodes: [{t:title, d:desc, cls?}], active: index currently highlighted.
   Nodes after `active` are hidden unless showAll (then shown as ghost). */
function flowV(nodes, active, { showAll = false, numbered = true } = {}) {
  let h = '<div class="flow">';
  nodes.forEach((n, k) => {
    if (k > active && !showAll) return;
    const state = k < active ? 'done' : k === active ? 'active' : 'ghost';
    if (k > 0) h += `<div class="arrow-v-wrap ${k <= active ? 'live' : ''}"><div class="arrow-v ${k === active ? '' : 'idle'}"></div></div>`;
    h += `<div class="node ${state} ${n.cls || ''}"><div class="nt">${numbered ? `<span class="num">${k + 1}</span>` : ''}${n.t}</div>${n.d ? `<div class="nd">${n.d}</div>` : ''}</div>`;
  });
  return h + '</div>';
}
function flowH(nodes, active) {
  let h = '<div class="hflow">';
  nodes.forEach((n, k) => {
    const state = k < active ? 'done' : k === active ? 'active' : 'ghost';
    if (k > 0) h += `<div class="arrow-h ${k === active ? 'live' : ''}"></div>`;
    h += `<div class="node ${state}"><div class="nt">${n.t}</div>${n.d ? `<div class="nd">${n.d}</div>` : ''}</div>`;
  });
  return h + '</div>';
}

/* ---------- Context window grid: 1 cell = `unit` tokens ----------
   segs: [{key, tokens, label?}] in fill order. Cells beyond capacity go to an overflow zone. */
function cwGrid(segs, capacity, { unit = 100, clickable = false, selected = null, animate = true, overflowLabel = 'Does NOT fit — over the limit' } = {}) {
  const capCells = Math.round(capacity / unit);
  const cells = [];
  segs.forEach(s => { const n = Math.round(s.tokens / unit); for (let k = 0; k < n; k++) cells.push(s.key); });
  const inside = cells.slice(0, capCells), over = cells.slice(capCells);
  const cell = (key, n) => {
    const c = COMP[key] || { color: '#999' };
    const cls = ['cell', 'f', key === 'out' ? 'out' : '', clickable ? 'click' : '', selected && selected !== key ? 'dim' : '', selected === key ? 'sel' : ''].join(' ');
    return `<div class="${cls}" data-key="${key}" title="${esc(c.label)}" style="--cc:${c.color};--d:${animate ? (n * 0.012).toFixed(3) : 0}s"></div>`;
  };
  let h = `<div class="cw-frame"><span class="cap">Context window · ${fmt(capacity)} tokens · 1 square = ${unit} tokens</span><div class="cw-grid">`;
  for (let k = 0; k < capCells; k++) h += k < inside.length ? cell(inside[k], k) : '<div class="cell"></div>';
  h += '</div></div>';
  if (over.length) {
    h += `<div class="overflow-zone"><div class="cap">✕ ${overflowLabel}: ${fmt(over.length * unit)} tokens</div><div class="cw-grid">${over.map((k, n) => cell(k, n)).join('')}</div></div>`;
  }
  return h;
}
function legend(keys, { clickable = false, selected = null, values = null } = {}) {
  return `<div class="legend">${keys.map(k => {
    const c = COMP[k]; const tag = clickable ? 'button' : 'span';
    return `<${tag} class="lg ${selected === k ? 'sel' : ''}" data-key="${k}" style="--cc:${c.color}"><i class="${k === 'out' ? 'out' : ''}"></i>${c.label}${values && values[k] != null ? ` · <b>${fmt(values[k])}</b>` : ''}</${tag}>`;
  }).join('')}</div>`;
}

/* ---------- Stacked horizontal bar with capacity marker ---------- */
function stackBar(segs, capacity, { showLabels = true } = {}) {
  const total = segs.reduce((a, s) => a + s.tokens, 0);
  const scale = Math.max(total, capacity);
  let used = 0, h = '';
  segs.forEach(s => {
    if (s.tokens <= 0) return;
    const w = (s.tokens / scale) * 100;
    const overPart = Math.max(0, used + s.tokens - capacity) - Math.max(0, used - capacity);
    const inPart = s.tokens - overPart;
    const lab = showLabels ? fmt(s.tokens) : '';
    if (inPart > 0) h += `<div class="seg ${s.key === 'out' ? 'out' : ''}" style="--cc:${COMP[s.key].color};width:${(inPart / scale) * 100}%" title="${esc(COMP[s.key].label)}: ${fmt(s.tokens)}">${inPart / scale > 0.07 ? lab : ''}</div>`;
    if (overPart > 0) h += `<div class="seg over" style="width:${(overPart / scale) * 100}%" title="Over the limit: ${fmt(overPart)}">${overPart / scale > 0.07 ? '+' + fmt(overPart) : ''}</div>`;
    used += s.tokens;
  });
  const capPos = (capacity / scale) * 100;
  return `<div class="sbar-wrap"><div class="cap-line" style="left:calc(${capPos}% - 2px)"><span style="${capPos > 75 ? 'left:auto;right:6px' : ''}">limit ${fmt(capacity)}</span></div><div class="sbar">${h}</div></div>`;
}
function bindLegendSelect(root, onSelect) {
  $$('[data-key]', root).forEach(el => {
    if (el.classList.contains('click') || el.tagName === 'BUTTON') el.addEventListener('click', () => onSelect(el.dataset.key));
  });
}

const BOX = 40; // toy box size (real models: thousands of tokens)
/* Illustrative token splits */

/** Draw the box of token slots. Items past BOX go into a red "doesn't fit" area. */
function box(items, { animFrom = 0, cap = BOX } = {}) {
  const slot = (it, k) => it
    ? `<div class="slot f ${it.hl ? 'hl' : ''}" style="--cc:${COMP[it.key].color};${k < animFrom ? 'animation:none' : ''}" title="Slot ${k + 1}: ${esc(it.t)}"><span class="p">#${k + 1}</span><span>${showSpaces(it.t)}</span></div>`
    : `<div class="slot"><span class="p">#${k + 1}</span></div>`;
  let h = `<div class="cw-frame"><span class="cap">Context window (toy size: ${cap} token slots)</span><div class="slots" style="margin-top:6px">`;
  for (let k = 0; k < cap; k++) h += slot(items[k], k);
  h += '</div></div>';
  const over = items.slice(cap);
  if (over.length) h += `<div class="overflow-zone"><div class="cap">✕ Does not fit: ${over.length} more tokens</div><div class="slots">${over.map((it, k) => slot(it, cap + k)).join('')}</div></div>`;
  return h;
}
function counter(used, cap = BOX) {
  const free = cap - used;
  return `<div class="row mt"><div class="stat"><div class="k">Used</div><div class="v">${used}</div></div><div class="stat ${free >= 0 ? 'ok' : 'bad'}"><div class="k">${free >= 0 ? 'Free' : 'Over by'}</div><div class="v">${Math.abs(free)}</div></div><div class="stat"><div class="k">Box size</div><div class="v">${cap}</div></div></div>`;
}
const chat = msgs => `<div class="chat" style="min-height:0;margin-bottom:12px">${msgs.map(m => `<div class="bub ${m[0] === 'u' ? 'u' : 'a'}"><span class="who">${m[0] === 'u' ? 'Utsab' : 'AI'}</span>${esc(m[1])}</div>`).join('')}</div>`;
/** Animate items appearing one by one after `start` already-shown items */
function animateBox(viz, header, base, add, footer) {
  const draw = n => {
    viz.innerHTML = header + `<div class="row mb" style="justify-content:space-between;align-items:center">${legend([...new Set([...base, ...add].map(x => x.key))])}<button class="btn btn-sm btn-navy" id="rp">⟲ Replay</button></div>` +
      box([...base, ...add.slice(0, n)], { animFrom: base.length + n - 1 }) + counter(base.length + n) + (n === add.length ? footer : '');
    $('#rp', viz).onclick = run;
  };
  const run = () => { clearStepTimers(); draw(0); for (let k = 1; k <= add.length; k++) later(() => draw(k), 400 + k * 230); };
  run();
}

step('full', 'What happens next? Three possibilities',
  ex({
    lead: 'The AI model does <b>not</b> clean up the box by itself. Usually the <b>chat app</b> must decide what to do. Click each option.',
    what: ['<b>Error</b>: the app sends the full request anyway, and the API refuses it. No answer.', '<b>Remove oldest message</b>: simple, but old facts are lost.', '<b>Summarize</b>: old chat becomes a short note. Key facts are kept in fewer tokens.'],
    why: 'This is the real job of “context management” in AI apps: choose what stays in the box.',
    note: 'What the API does with an oversized request depends on the provider. Usually it returns an error; some offer optional automatic trimming.'
  }),
  viz => {
    let opt = 'err';
    const draw = () => {
      let body = '';
      if (opt === 'err') {
        body = box([...tag(Q1, 'hist'), ...tag(A1, 'hist'), ...tag(Q2, 'hist'), ...tag(A2, 'hist'), ...tag(Q3, 'user')]) +
          codeBlock(`{ "error": "Request too large: 48 tokens needed, limit is 40." }`, 'json', 'Illustrative API error') +
          `<div class="verdict bad mt"><span class="big">✕</span>Utsab gets no answer.</div>`;
      } else if (opt === 'drop') {
        const items = [...tag(A1, 'hist'), ...tag(Q2, 'hist'), ...tag(A2, 'hist'), ...tag(Q3, 'user')];
        body = `<div class="box mb small" style="border-color:#fca5a5;background:var(--red-soft)"><b>Removed:</b> <s>“My name is Utsab, I want to learn Python and machine learning and AI.”</s> (17 tokens)</div>` +
          box(items) + counter(items.length) +
          `<div class="grid2 mt"><div class="box"><h5 style="color:var(--green-d)">Now</h5><ul class="pl good"><li>Fits, with 9 slots free for the answer</li></ul></div><div class="box"><h5 style="color:var(--red)">But</h5><ul class="pl bad"><li>The goal “Python, machine learning and AI” is no longer in the box</li></ul></div></div>`;
      } else {
        const items = [...tag(SUM, 'summary', ['Ut', 'sab', 'Python', 'ML', 'AI']), ...tag(Q3, 'user')];
        body = `<div class="summary-box mb"><b>Old chat (35 tokens) → short summary (10 tokens):</b> “Utsab wants Python, ML, AI.”</div>` +
          box(items) + counter(items.length) +
          `<div class="grid2 mt"><div class="box"><h5 style="color:var(--green-d)">Now</h5><ul class="pl good"><li>Fits, with 17 slots free for the answer</li><li>Name and goals are kept</li></ul></div><div class="box"><h5 style="color:var(--red)">But</h5><ul class="pl bad"><li>Making the summary costs an extra AI call</li><li>Exact wording of old messages is gone</li></ul></div></div>`;
      }
      viz.innerHTML = HYP('Toy box: 40 slots') + `<div class="tabs">${[['err', '1 · Error'], ['drop', '2 · Remove oldest message'], ['sum', '3 · Summarize']].map(([k, l]) => `<button class="btn btn-sm ${opt === k ? 'btn-navy' : ''}" data-o="${k}">${l}</button>`).join('')}</div>` + body;
      $$('[data-o]', viz).forEach(b => b.onclick = () => { opt = b.dataset.o; draw(); });
    };
    draw();
  });
const SIM_DEFAULT = { cap: 8000, sys: 500, hist: 3000, rag: 2000, user: 500, out: 1500 };
const SIM_PRESETS = {
  'Fits comfortably': { cap: 8000, sys: 500, hist: 3000, rag: 2000, user: 500, out: 1500 },
  'Exactly full': { cap: 8000, sys: 500, hist: 4000, rag: 2000, user: 1000, out: 500 },
  'Overflow': { cap: 8000, sys: 500, hist: 4800, rag: 2000, user: 1000, out: 500 },
  'Huge input': { cap: 8000, sys: 800, hist: 6000, rag: 3000, user: 600, out: 1000 },
  '128K model': { cap: 128000, sys: 2000, hist: 60000, rag: 30000, user: 2000, out: 4000 }
};
const SIM_FIELDS = [
  ['cap', 'Total context capacity', null, 1000, 200000, 500],
  ['sys', 'System instruction tokens', 'sys', 0, 20000, 50],
  ['hist', 'Conversation history tokens', 'hist', 0, 20000, 50],
  ['rag', 'Retrieved document tokens', 'rag', 0, 20000, 50],
  ['user', 'Current user message tokens', 'user', 0, 20000, 50],
  ['out', 'Desired output tokens', 'out', 0, 20000, 50]
];
/** Pure calculation — kept separate so it is easy to verify */
function simCalc(s) {
  const input = s.sys + s.hist + s.rag + s.user;
  const required = input + s.out;
  const remaining = s.cap - required;
  return { input, output: s.out, required, capacity: s.cap, remaining, fits: remaining >= 0, deficit: Math.max(0, -remaining), inputAloneTooBig: input > s.cap };
}
/** How much to cut from `field` (then the next fields) to fit. Returns {cuts, stillShort} */
function simPlanFix(s, order) {
  let deficit = simCalc(s).deficit; const cuts = {};
  for (const f of order) { if (deficit <= 0) break; const c = Math.min(deficit, s[f]); if (c > 0) { cuts[f] = c; deficit -= c; } }
  return { cuts, stillShort: deficit };
}
const toInt = v => { const n = Math.round(Number(v)); return Number.isFinite(n) ? clamp(n, 0, 10000000) : 0; };

step('try', 'Real sizes: try the calculator',
  ex({
    lead: 'Change any value with the slider or type an exact number. Every result recalculates instantly.',
    what: ['Total input, requested output, total required, capacity and remaining capacity', 'Whether the request fits', 'Visual bars for each component and for overall usage'],
    try: 'Choose the “Overflow” preset, then press <b>Trim old history</b> or <b>Reduce retrieved docs</b> to see the minimum cut that makes the request fit. Then try “Huge input” and reduce only the output — it won’t be enough.',
    note: 'Hypothetical model. Real APIs may count tokens and reserve output differently.'
  }), viz => {
    if (!App.sim) App.sim = { ...SIM_DEFAULT };
    let lastMsg = '', undo = null;
    const draw = () => {
      const s = App.sim, c = simCalc(s);
      const segs = [{ key: 'sys', tokens: s.sys }, { key: 'hist', tokens: s.hist }, { key: 'rag', tokens: s.rag }, { key: 'user', tokens: s.user }, { key: 'out', tokens: s.out }];
      const pct = s.cap > 0 ? c.required / s.cap * 100 : 0;
      const planH = simPlanFix(s, ['hist']), planR = simPlanFix(s, ['rag']), planBoth = simPlanFix(s, ['hist', 'rag']);
      viz.innerHTML = HYP('Hypothetical model · all calculations live') + `<div class="row mb">${Object.keys(SIM_PRESETS).map(k => `<button class="btn btn-sm" data-preset="${esc(k)}">${esc(k)}</button>`).join('')}<button class="btn btn-sm" id="simReset">⟲ Reset</button></div>
      <div class="sim"><div>${SIM_FIELDS.map(([k, lab, ck, min, max, st]) => `
        <div class="field"><label for="n_${k}"><span>${ck ? `<i style="--cc:${COMP[ck].color}"></i>` : ''}${lab}</span>${k !== 'cap' ? `<span class="muted small">${s.cap ? (s[k] / s.cap * 100).toFixed(1) : 0}%</span>` : ''}</label>
          <div class="pair"><input type="range" id="r_${k}" min="${min}" max="${Math.max(max, s[k])}" step="${st}" value="${s[k]}"><input type="number" id="n_${k}" min="0" step="1" value="${s[k]}"></div>
          ${k !== 'cap' ? `<div class="meter mt-s" style="height:6px"><div style="width:${Math.min(100, s.cap ? s[k] / s.cap * 100 : 0)}%;background:${COMP[ck].color}"></div></div>` : ''}</div>`).join('')}</div>
      <div>
        <div class="row">
          <div class="stat"><div class="k">Total input</div><div class="v" id="o_input">${fmt(c.input)}</div></div>
          <div class="stat"><div class="k">Requested output</div><div class="v" id="o_output">${fmt(c.output)}</div></div>
          <div class="stat"><div class="k">Total required</div><div class="v" id="o_required">${fmt(c.required)}</div></div>
        </div><div class="row mt-s">
          <div class="stat"><div class="k">Available capacity</div><div class="v" id="o_cap">${fmt(c.capacity)}</div></div>
          <div class="stat ${c.fits ? 'ok' : 'bad'}"><div class="k">Remaining capacity</div><div class="v" id="o_remaining">${fmt(c.remaining)}</div></div>
        </div>
        <div class="label mt">Overall usage · ${pct.toFixed(1)}%</div><div class="meter ${pct > 100 ? 'bad' : pct > 90 ? 'warn' : ''}" style="height:16px"><div style="width:${Math.min(100, pct)}%"></div></div>
        <div class="label mt">Context composition</div>${stackBar(segs, s.cap)}${legend(segs.map(x => x.key))}
        <div class="verdict ${c.fits ? 'ok' : 'bad'} mt" id="o_verdict"><span class="big">${c.fits ? '✓' : '⚠'}</span><span>${c.fits ? `Request fits — ${fmt(c.remaining)} tokens to spare.` : `Warning: over the limit by ${fmt(c.deficit)} tokens. The API may reject this request.`}</span></div>
        ${!c.fits ? `<div class="box mt"><b>How to make it fit</b>
          <ul class="small" style="margin:6px 0;padding-left:18px">
            <li>Trim old history: ${planH.stillShort ? `removing all ${fmt(s.hist)} history tokens is still ${fmt(planH.stillShort)} short` : `remove <b>${fmt(planH.cuts.hist)}</b> tokens (history ${fmt(s.hist)} → ${fmt(s.hist - planH.cuts.hist)})`}</li>
            <li>Reduce retrieved docs: ${planR.stillShort ? `removing all ${fmt(s.rag)} doc tokens is still ${fmt(planR.stillShort)} short` : `remove <b>${fmt(planR.cuts.rag)}</b> tokens (docs ${fmt(s.rag)} → ${fmt(s.rag - planR.cuts.rag)})`}</li>
            ${c.inputAloneTooBig ? `<li>Reducing output alone cannot help: the input (${fmt(c.input)}) is already larger than the capacity (${fmt(s.cap)}).</li>` : `<li>Or lower the desired output by ${fmt(c.deficit)} (to ${fmt(s.out - c.deficit)}) — risk: shorter or cut-off answers.</li>`}
          </ul>
          <div class="row"><button class="btn btn-sm btn-navy" id="fixH" ${s.hist === 0 ? 'disabled' : ''}>Trim old history</button><button class="btn btn-sm btn-green" id="fixR" ${s.rag === 0 ? 'disabled' : ''}>Reduce retrieved docs</button><button class="btn btn-sm btn-primary" id="fixB">Auto-fix (history, then docs)</button></div>
          ${planBoth.stillShort ? `<p class="small" style="color:var(--red);margin:6px 0 0">Even removing all history and docs leaves it ${fmt(planBoth.stillShort)} short — reduce instructions, the message or the output too.</p>` : ''}</div>` : ''}
        ${lastMsg ? `<div class="box mt small" style="border-color:#86efac;background:var(--green-soft);animation:fadeUp .3s both">${lastMsg} ${undo ? '<button class="btn btn-sm" id="undo">Undo</button>' : ''}</div>` : ''}
      </div></div>`;
      // ---- bindings ----
      SIM_FIELDS.forEach(([k]) => {
        const r = $('#r_' + k, viz), n = $('#n_' + k, viz);
        r.addEventListener('input', () => { App.sim[k] = toInt(r.value); n.value = App.sim[k]; lastMsg = ''; undo = null; liveUpdate(); });
        r.addEventListener('change', draw);
        n.addEventListener('input', () => { App.sim[k] = toInt(n.value); r.value = App.sim[k]; liveUpdate(); });
        n.addEventListener('change', () => { App.sim[k] = toInt(n.value); lastMsg = ''; undo = null; draw(); });
      });
      $$('[data-preset]', viz).forEach(b => b.onclick = () => { App.sim = { ...SIM_PRESETS[b.dataset.preset] }; lastMsg = `Loaded preset “${b.dataset.preset}”.`; undo = null; draw(); });
      $('#simReset', viz).onclick = () => { App.sim = { ...SIM_DEFAULT }; lastMsg = 'Reset to defaults.'; undo = null; draw(); };
      const applyFix = (order, label) => {
        const plan = simPlanFix(App.sim, order); undo = { ...App.sim };
        Object.entries(plan.cuts).forEach(([f, v]) => { App.sim[f] -= v; });
        const parts = Object.entries(plan.cuts).map(([f, v]) => `${fmt(v)} tokens from ${f === 'hist' ? 'old history' : 'retrieved docs'}`);
        lastMsg = parts.length ? `${label}: removed ${parts.join(' and ')}. ${simCalc(App.sim).fits ? '✓ The request now fits.' : `Still ${fmt(simCalc(App.sim).deficit)} tokens over.`}` : 'Nothing to remove.';
        draw();
      };
      if ($('#fixH', viz)) $('#fixH', viz).onclick = () => applyFix(['hist'], 'Trimmed history');
      if ($('#fixR', viz)) $('#fixR', viz).onclick = () => applyFix(['rag'], 'Reduced docs');
      if ($('#fixB', viz)) $('#fixB', viz).onclick = () => applyFix(['hist', 'rag'], 'Auto-fix');
      if ($('#undo', viz)) $('#undo', viz).onclick = () => { App.sim = undo; undo = null; lastMsg = 'Undone.'; draw(); };
    };
    // Fast path while dragging a slider: update numbers without rebuilding inputs (keeps the drag smooth)
    const liveUpdate = () => {
      const c = simCalc(App.sim);
      $('#o_input', viz).textContent = fmt(c.input); $('#o_output', viz).textContent = fmt(c.output);
      $('#o_required', viz).textContent = fmt(c.required); $('#o_cap', viz).textContent = fmt(c.capacity);
      const rem = $('#o_remaining', viz); rem.textContent = fmt(c.remaining); rem.parentElement.className = 'stat ' + (c.fits ? 'ok' : 'bad');
      const v = $('#o_verdict', viz); v.className = 'verdict mt ' + (c.fits ? 'ok' : 'bad');
      v.innerHTML = `<span class="big">${c.fits ? '✓' : '⚠'}</span><span>${c.fits ? `Request fits — ${fmt(c.remaining)} tokens to spare.` : `Warning: over the limit by ${fmt(c.deficit)} tokens. Release the slider to see fixes.`}</span>`;
    };
    draw();
  });

(function init() {
  buildNav();
  let start = 0;
  const m = /^#step-(\d+)$/.exec(location.hash || '');
  if (m) start = clamp(+m[1] - 1, 0, STEPS.length - 1);
  go(start, { scrollChip: false });
})();
</script>
</body>
</html>
