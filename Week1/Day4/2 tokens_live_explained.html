<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How AI Tokens Work: Live, Step by Step</title>
<style>
  :root{--o:#F26B21;--d:#1F2430;--g:#5A6272;--bg:#F7F8FA;--line:#E2E5EA}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:var(--d)}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding:16px;max-width:1700px;margin:0 auto;align-items:start}
  .left{min-width:0}
  .right{position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column;gap:12px;min-height:0}
  .right .now{flex:1 1 auto;overflow:auto;min-height:0}
  .right .list{flex:0 0 auto;max-height:34vh;overflow:auto;padding-top:12px;padding-bottom:10px}
  @media (max-width:1000px){.layout{grid-template-columns:1fr}.right{position:static;height:auto}}
  .stage{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .nowhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .live{font-size:12px;font-weight:700;color:var(--o);display:flex;align-items:center;gap:6px}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--o);animation:bl 1.2s infinite}
  @keyframes bl{50%{opacity:.2}}
  .hint{font-size:12.5px;color:var(--g);margin-top:-4px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0;box-shadow:0 4px 14px rgba(0,0,0,.05)}
  button{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--d);
    padding:9px 14px;border-radius:10px;cursor:pointer}
  button:hover{border-color:var(--o)}
  button.primary{background:var(--o);border-color:var(--o);color:#fff;min-width:110px}
  input[type=range]{flex:1;min-width:180px;accent-color:var(--o)}
  .time{font-family:Consolas,Menlo,monospace;font-size:14px;color:var(--g);min-width:92px;text-align:right}
  label.chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--g);cursor:pointer}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .now .tag{display:inline-block;background:var(--d);color:#fff;font-size:12px;font-weight:700;
    padding:4px 10px;border-radius:20px;letter-spacing:.4px}
  .now h2{margin:10px 0 4px;font-size:21px;line-height:1.25}
  .now .what{font-size:15.5px;line-height:1.6}
  .now .what p{margin:0 0 10px}
  .now .why{margin-top:12px;padding:12px 14px;background:#FFF4EC;border-left:4px solid var(--o);border-radius:8px;font-size:14.5px;line-height:1.55}
  .now .why b{color:var(--o)}
  code{font-family:Consolas,Menlo,monospace;background:#EEF0F3;padding:1px 6px;border-radius:5px;font-size:.92em}
  .steps{list-style:none;margin:0;padding:0}
  .steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:10px;cursor:pointer;font-size:14.5px;line-height:1.4}
  .steps li:hover{background:#F3F4F7}
  .steps li .n{flex:0 0 26px;height:26px;border-radius:50%;background:#E9EBEF;color:var(--g);font-size:12px;font-weight:700;display:grid;place-items:center}
  .steps li.active{background:#FFF4EC}
  .steps li.active .n{background:var(--o);color:#fff}
  .steps li.done .n{background:var(--d);color:#fff}
  .steps li small{display:block;color:var(--g);font-size:12.5px}
  h3{margin:0 0 10px;font-size:15px;color:var(--g);letter-spacing:.4px;text-transform:uppercase}
  .hint{font-size:12.5px;color:var(--g);margin-top:10px}
  .bar{height:4px;background:#E9EBEF;border-radius:4px;margin:8px 0 12px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--o)}
</style>
</head>

<text x="40" y="222" class="cap" font-weight="600" opacity="0">You type a question. The model cannot read letters, so it has to be converted.<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.0000;0.0089;0.1196;0.1286;1.0000" values="0;0;1;1;0;0"/></text>
<text x="40" y="222" class="cap" font-weight="600" opacity="0">Split into single characters (really bytes) → 34 pieces.<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.1286;0.1375;0.1768;0.1857;1.0000" values="0;0;1;1;0;0"/></text>
<text x="40" y="222" class="cap" font-weight="600" opacity="0">Merge round 1: frequent pairs join: W+h→Wh, a+t→at, h+e→he, s+h→sh …<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.1857;0.1946;0.2482;0.2571;1.0000" values="0;0;1;1;0;0"/></text>
<text x="40" y="222" class="cap" font-weight="600" opacity="0">Merge round 2: keep merging: Wh+at→What, ␣t+he→␣the, de+sh→desh …<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.2571;0.2661;0.3196;0.3286;1.0000" values="0;0;1;1;0;0"/></text>
<text x="40" y="222" class="cap" font-weight="600" opacity="0">No more merge rules apply → 8 tokens. (␣ = leading space is part of the token)<animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" keyTimes="0.0000;0.3286;0.3375;0.3839;0.3929;1.0000" values="0;0;1;1;0;0"/></text>

    <div class="controls">
      <button id="prev" title="Previous step (←)">⏮ Prev</button>
      <button id="play" class="primary" title="Play / Pause (Space)">⏸ Pause</button>
      <button id="next" title="Next step (→)">Next ⏭</button>
      <button id="restart" title="Restart (R)">↺ Restart</button>
      <input id="scrub" type="range" min="0" max="27.9" step="0.05" value="0" aria-label="Timeline">
      <span class="time" id="time">0.0s / 28s</span>
      <label class="chk"><input type="checkbox" id="autopause"> Auto-pause at each step</label>
    </div>
    <div class="hint">Keyboard: <code>Space</code> play/pause · <code>←</code> <code>→</code> step · <code>R</code> restart</div>

  <aside class="right">
    <div class="card now">
      <div class="nowhead">
        <span class="tag" id="nowTag">STEP 1</span>
        <span class="live"><i></i>What's happening now</span>
      </div>
      <h2 id="nowTitle"></h2>
      <div class="bar"><i id="nowBar"></i></div>
      <div class="what" id="nowWhat"></div>
      <div class="why" id="nowWhy"></div>
    </div>
    <div class="card list">
      <h3>All steps (click to jump)</h3>
      <ul class="steps" id="steps"></ul>
    </div>
  </aside>
</div>

<script>
const LOOP = 28;
const PHASES = [
  {s:0.0, e:3.6, stage:"Type text", title:"You type a question",
   what:`<p>You type <code>What is the capital of Bangladesh?</code>. To the computer this is just 34 characters, stored as bytes.</p>
         <p>A neural network can only do math on numbers from a <b>fixed list</b>. It doesn't know what "W" or "h" means. So before the model sees anything, a separate program called the <b>tokenizer</b> converts your text.</p>`,
   why:`<b>Key idea:</b> the model never reads letters or words. It only reads <b>token IDs</b> (integers). Everything that follows turns your question into IDs, and the answer IDs back into text.`},

  {s:3.6, e:5.2, stage:"BPE merging", title:"Split into the smallest pieces",
   what:`<p>The tokenizer (BPE = <i>Byte Pair Encoding</i>) first breaks the question into single characters (really bytes): <b>34 pieces</b>, spaces included (shown as <code>␣</code>).</p>
         <p>Every single byte is already in the vocabulary, so <b>no text is ever "unknown"</b>. Bangla text like <code>ঢাকা</code> or an emoji can always be represented too.</p>`,
   why:`<b>Why not stop here?</b> 34 pieces for 6 words is too many. Longer sequences mean more computation, higher cost and less room in the context window. So the tokenizer merges pieces next.`},

  {s:5.2, e:7.2, stage:"BPE merging", title:"Merge round 1: frequent pairs join",
   what:`<p>During training, the tokenizer counted which neighbouring pairs appear most often in huge amounts of text. It saved them as a <b>ranked list of merge rules</b>: <code>W+h→Wh</code>, <code>a+t→at</code>, <code>h+e→he</code>, <code>s+h→sh</code> …</p>
         <p>Now it applies those rules to your question. The <b>orange-bordered boxes</b> just merged. Pieces with no matching rule (like <code>s</code>, <code>f</code>, <code>?</code>) stay single for now.</p>`,
   why:`<b>Important:</b> these rules are learned once and never change. <code>What is the capital of Bangladesh?</code> always becomes exactly the same tokens.`},

  {s:7.2, e:9.2, stage:"BPE merging", title:"Merge round 2: merged pieces merge again",
   what:`<p>Merged pieces can merge again if a rule exists: <code>Wh+at→What</code>, <code>␣t+he→␣the</code>, <code>␣c+ap→␣cap</code>, <code>de+sh→desh</code>, <code>␣B+an+g→␣Bang</code> …</p>
         <p>The tokenizer repeats this as long as <b>any neighbouring pair has a rule</b>, always applying the highest-ranked rule first. Each round makes the pieces bigger and fewer.</p>`,
   why:`<b>Think of it as compression:</b> common letter patterns become one unit, the way you read "the" as one shape, not t-h-e.`},

  {s:9.2, e:11.0, stage:"BPE merging", title:"Final result: 8 tokens",
   what:`<p>No more rules apply. The tokens are: <code>What</code> <code>␣is</code> <code>␣the</code> <code>␣capital</code> <code>␣of</code> <code>␣Bangla</code> <code>desh</code> <code>?</code></p>
         <p>Very common English words (<code>␣the</code>, <code>␣capital</code>) became <b>one token each</b>. "Bangladesh" is less common in training text, so in this example it becomes <b>2 pieces</b>: <code>␣Bangla</code> + <code>desh</code>. That's how subword tokens handle any word or name.</p>`,
   why:`<b>Notice the ␣:</b> the space belongs to the <i>next</i> word. <code>"the"</code> and <code>" the"</code> are different tokens with different IDs.`},

  {s:11.0, e:17.2, stage:"ID lookup", title:"Look up each token's ID",
   what:`<p>The vocabulary is basically a big dictionary (~50k–200k entries): <code>{"What": 3923, " is": 382, " the": 290, …}</code></p>
         <p>Watch each token light up, its row highlight in the <b>Vocabulary</b> table on the right of the animation, and its number drop down. The question becomes a list of integers:<br><code>[3923, 382, 290, 9029, 328, 42563, 31301, 30]</code></p>`,
   why:`<b>This is what the API counts and bills:</b> 8 input tokens. Try it in Python: <code>tiktoken.get_encoding("o200k_base").encode("What is the capital of Bangladesh?")</code> (real IDs will differ from this example).`},

  {s:17.2, e:18.0, stage:"Predict next token", title:"IDs are sent into the model",
   what:`<p>The 8 IDs become the <b>context</b> (the dark chips). Inside the model, each ID selects its row in the <b>embedding table</b> and becomes a long vector (thousands of numbers) that represents its meaning. Position info is added so word order is known.</p>
         <p>The orange bar scanning through the Transformer shows the vectors passing through every layer.</p>`,
   why:`<b>Embedding</b> = turning an ID into meaning-numbers. "Dhaka", "Chittagong" and "Sylhet" end up with similar vectors because they're used in similar ways.`},

  {s:18.0, e:21.0, stage:"Predict next token", title:"Generate token #1: \"Dhaka\"",
   what:`<p>In every layer, <b>attention</b> lets each token look at the others. The last position pays strong attention to <code>␣capital</code>, <code>␣Bangla</code> and <code>desh</code>.</p>
         <p>At the end, the model gives a <b>score for every one of ~200,000 vocabulary entries</b>. Softmax turns the scores into probabilities. <code>Dhaka</code> gets 86% because during training the model saw "capital of Bangladesh … Dhaka" many times.</p>
         <p>One token is <b>picked</b>. Its ID <code>71234</code> is <b>appended to the context</b> (orange chip), and the ID is turned back into text ("detokenized") in the output.</p>`,
   why:`<b>The "knowledge" is just probabilities.</b> The model doesn't look up a database; it learned which token usually follows. <b>Temperature</b> controls the pick: low means almost always the top bar, high means more random.`},

  {s:21.0, e:24.0, stage:"Predict next token", title:"Generate token #2: \".\"",
   what:`<p>The context is now <b>9 IDs</b>: your question plus <code>Dhaka</code>. The model runs again on the whole sequence, so <b>its own output becomes its input</b>.</p>
         <p>New probabilities: <code>.</code> 74%, newline 12%, <code>!</code> 6% … It picks <code>.</code> (ID <code>13</code>), which is appended again. The output now reads <b>"Dhaka."</b></p>`,
   why:`<b>This is "autoregressive" generation:</b> one token per step, and each step depends on everything before it. That's why replies appear word by word ("streaming"). Real systems keep a <i>KV cache</i> so earlier work isn't recomputed.`},

  {s:24.0, e:27.4, stage:"Predict next token", title:"The <end> token: stop",
   what:`<p>The vocabulary also has <b>special tokens</b> that aren't text. Here <code>&lt;end&gt;</code> wins with 91%, meaning "the answer is complete." Generation stops.</p>
         <p>It can also stop because it reached the <code>max_tokens</code> limit you set in the API (then the answer is cut off).</p>
         <p><b>Total for this request:</b> 8 input tokens + 3 output tokens (<code>Dhaka</code>, <code>.</code>, <code>&lt;end&gt;</code>).</p>`,
   why:`<b>Context window</b> = input + output must fit in the model's limit. In a chat, the whole history is sent again each turn, so token usage grows over a conversation.`},
];
const svg = document.getElementById('anim');
const $ = id => document.getElementById(id);
const playBtn = $('play'), scrub = $('scrub');
let lastIdx = -1, scrubbing = false;

// build step list
PHASES.forEach((p,i)=>{
  const li = document.createElement('li');
  li.innerHTML = `<span class="n">${i+1}</span><span>${p.title.replace(/</g,'&lt;')}<small>${p.stage} · ${p.s.toFixed(1)}s</small></span>`;
  li.onclick = ()=>jump(i);
  $('steps').appendChild(li);
});

const now = () => ((svg.getCurrentTime() % LOOP) + LOOP) % LOOP;
const idxAt = t => { for (let i=PHASES.length-1;i>=0;i--) if (t >= PHASES[i].s) return i; return 0; };
function setPaused(p){ p ? svg.pauseAnimations() : svg.unpauseAnimations(); playBtn.textContent = p ? '▶ Play' : '⏸ Pause'; }
function jump(i){
  i = (i + PHASES.length) % PHASES.length;
  svg.setCurrentTime(PHASES[i].s + 0.35);
  lastIdx = i;               // don't auto-pause on the step we jumped to
  render(true);
}
function render(force){
  const t = now(), i = idxAt(t), p = PHASES[i];
  if (!scrubbing) scrub.value = t.toFixed(2);
  $('time').textContent = `${t.toFixed(1)}s / ${LOOP}s`;
  $('nowBar').style.width = Math.min(100, Math.max(0, (t - p.s) / (p.e - p.s) * 100)) + '%';
  if (i !== lastIdx || force){
    if (i !== lastIdx && !force && $('autopause').checked && !svg.animationsPaused() && lastIdx !== -1){
      svg.setCurrentTime(p.s + 0.35); setPaused(true);
    }
    lastIdx = i;
    $('nowTag').textContent = `STEP ${i+1} / ${PHASES.length} · ${p.stage}`;
    const act=$('steps').children[i], box=act&&act.closest('.list'); if(box){const top=act.offsetTop-box.offsetTop; box.scrollTop=top-box.clientHeight/2+act.clientHeight/2;}
    $('nowTitle').textContent = p.title;
    $('nowWhat').innerHTML = p.what; document.querySelector('.right .now').scrollTop=0;
    $('nowWhy').innerHTML = p.why;
    [...$('steps').children].forEach((li,k)=>{ li.classList.toggle('active',k===i); li.classList.toggle('done',k<i); });
  }
}
(function loop(){ render(false); requestAnimationFrame(loop); })();

playBtn.onclick = () => setPaused(!svg.animationsPaused());
$('prev').onclick = () => { const t=now(), i=idxAt(t); jump(t - PHASES[i].s > 1 ? i : i-1); };
$('next').onclick = () => jump(idxAt(now()) + 1);
$('restart').onclick = () => { jump(0); setPaused(false); };
scrub.addEventListener('input', () => { scrubbing = true; svg.setCurrentTime(parseFloat(scrub.value)); render(true); });
scrub.addEventListener('change', () => { scrubbing = false; });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  if (e.code === 'Space'){ e.preventDefault(); playBtn.click(); }
  else if (e.key === 'ArrowRight') $('next').click();
  else if (e.key === 'ArrowLeft') $('prev').click();
  else if (e.key.toLowerCase() === 'r') $('restart').click();
});
</script>
